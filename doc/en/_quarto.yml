# One website project per language; the two outputs land side by side
# in ../../site/{en,de} so the relative language-switcher links line up.
# The sidebars of en and de must stay parallel — gen_langmap.py derives
# the switcher's page map from them and fails when they drift.
project:
  type: website
  output-dir: ../../site/en
  resources:
    - fonts/
  # Enrich the rendered literature page with COinS (Zotero-readable) and
  # per-entry BibTeX/RIS download buttons, from dev/references.bib (theme
  # feature).
  post-render:
    - ../offline/literature.py

lang: en

# Built by bibliography.py from the Zotero library (Better BibTeX);
# re-run that script after adding missing works to Zotero.
bibliography: references.bib
link-citations: true

website:
  title: qdaPy
  site-url: https://qdapy.zotqda.org/latest/en/
  repo-url: https://github.com/fre-ms/qdaPy
  navbar:
    search: true
    # Stay visible while scrolling; the
    # frosted-glass look on top of it comes from the theme.
    pinned: true
    right:
      # Language menu behind the translate icon — grows
      # with further languages. The hrefs are static fallbacks, only
      # correct from the top level; the inlined langmap.js retargets
      # them to the translation of the current page.
      # The whole documentation as one linked PDF, built by
      # the theme's print/make_pdf.py during the site build.
      - icon: file-pdf
        aria-label: PDF
        href: qdaPy-documentation.pdf
      - icon: translate
        aria-label: Language
        menu:
          - text: English
            href: ../en/index.html
          - text: Deutsch
            href: ../de/index.html
      # The theme moves this item over the right sidebar.
      - icon: github
        text: GitHub
        href: https://github.com/fre-ms/qdaPy
  sidebar:
    style: docked
    collapse-level: 3
    contents:
      - text: Getting started
        href: index.qmd
      - text: Features
        href: features.qmd
      - text: Compared with other software
        href: comparison.qmd
      - section: User guide
        contents:
          - text: Reading exports
            href: guide/reading.qmd
          - text: Reading a .qdpx
            href: guide/qdpx.qmd
          - text: The example study
            href: guide/example-data.qmd
          - text: Figures
            href: guide/figures.qmd
          - text: Agreement
            href: guide/agreement.qmd
          - text: Reliability
            href: guide/reliability.qmd
          - text: Unitizing
            href: guide/unitizing.qmd
          - text: Statistics
            href: guide/statistics.qmd
          - text: Planning a study
            href: guide/planning.qmd
          - text: Reporting checklists
            href: guide/reporting.qmd
          - text: Code identity
            href: guide/identity.qmd
      - section: For developers
        contents:
          - text: Architecture
            href: dev/architecture.qmd
          - text: Design decisions
            href: dev/design.qmd
          - text: The exchange contract
            href: dev/contract.qmd
          - text: Testing
            href: dev/testing.qmd
          - text: Contributing
            href: dev/contributing.qmd
      - text: Origins
        href: origins.qmd
      - text: Literature
        href: dev/literature.qmd
      - text: Licence
        href: licence.qmd
      - text: Impressum
        href: impressum.qmd
      - text: Privacy
        href: privacy.qmd
  page-footer:
    center: >-
      © fre.ms — AGPL-3.0-or-later; what you produce with it stays yours —
      [Impressum](https://qdapy.zotqda.org/latest/en/impressum.html) ·
      [Privacy](https://qdapy.zotqda.org/latest/en/privacy.html)

# The look comes from the vendored zotqda-theme extension (refresh it
# with ../update-theme.sh); toc and code-copy are part of the format.
format:
  zotqda-theme-html:
    css: fonts/noto.css
    include-after-body: theme/scripts.html
