# Ein Website-Projekt je Sprache; die Ausgaben liegen nebeneinander in
# ../../site/{en,de}, damit die relativen Links des Sprachumschalters
# passen. Die Sidebars von en und de müssen parallel bleiben —
# gen_langmap.py leitet daraus die Seitenzuordnung des Umschalters ab
# und schlägt fehl, wenn sie auseinanderlaufen.
project:
  type: website
  output-dir: ../../site/de
  resources:
    - fonts/
  # Reichert die gerenderte Literaturseite mit COinS (für Zotero lesbar) und
  # BibTeX/RIS-Download-Buttons pro Eintrag an, aus dev/references.bib
  # (Theme-Funktion).
  post-render:
    - ../offline/literature.py

lang: de

# Aus der Zotero-Bibliothek erzeugt (bibliography.py, Better BibTeX);
# nach dem Nachpflegen fehlender Werke dort erneut laufen lassen.
bibliography: references.bib
link-citations: true

website:
  title: qdaPy
  site-url: https://qdapy.zotqda.org/latest/de/
  repo-url: https://github.com/fre-ms/qdaPy
  navbar:
    search: true
    # Beim Scrollen sichtbar bleiben; der
    # Milchglas-Effekt darauf kommt aus dem Theme.
    pinned: true
    right:
      # Sprachmenü hinter dem Übersetzungs-Symbol —
      # wächst mit weiteren Sprachen. Die hrefs sind statische
      # Rückfälle, nur von der obersten Ebene aus korrekt; das
      # eingebettete langmap.js biegt sie auf die Übersetzung der
      # aktuellen Seite um.
      # The whole documentation as one linked PDF, built by
      # the theme's print/make_pdf.py during the site build.
      - icon: file-pdf
        aria-label: PDF
        href: qdaPy-Dokumentation.pdf
      - icon: translate
        aria-label: Sprache
        menu:
          - text: English
            href: ../en/index.html
          - text: Deutsch
            href: ../de/index.html
      # Das Theme rückt diesen Eintrag über die rechte Seitenleiste.
      - icon: github
        text: GitHub
        href: https://github.com/fre-ms/qdaPy
  sidebar:
    style: docked
    collapse-level: 3
    contents:
      - text: Start
        href: index.qmd
      - text: Funktionen
        href: funktionen.qmd
      - text: Vergleich mit anderer Software
        href: vergleich.qmd
      - section: qdaPy anwenden
        contents:
          - text: Exporte lesen
            href: guide/lesen.qmd
          - text: Eine .qdpx lesen
            href: guide/qdpx.qmd
          - text: Die Beispielstudie
            href: guide/beispieldaten.qmd
          - text: Abbildungen
            href: guide/abbildungen.qmd
          - text: Übereinstimmung
            href: guide/uebereinstimmung.qmd
          - text: Reliabilität
            href: guide/reliabilitaet.qmd
          - text: Unitizing
            href: guide/unitizing.qmd
          - text: Statistik
            href: guide/statistik.qmd
          - text: Studien planen
            href: guide/planung.qmd
          - text: Berichts-Checklisten
            href: guide/berichte.qmd
          - text: Code-Identität
            href: guide/code-identitaet.qmd
      - section: Für Entwickler
        contents:
          - text: Architektur
            href: dev/architektur.qmd
          - text: Entwurfsentscheidungen
            href: dev/entwurf.qmd
          - text: Der Austauschvertrag
            href: dev/vertrag.qmd
          - text: Tests
            href: dev/tests.qmd
          - text: Mitwirken
            href: dev/mitwirken.qmd
      - text: Entstehung
        href: entstehung.qmd
      - text: Literatur
        href: dev/literatur.qmd
      - text: Lizenz
        href: lizenz.qmd
      - text: Impressum
        href: impressum.qmd
      - text: Datenschutz
        href: datenschutz.qmd
  page-footer:
    center: >-
      © fre.ms — AGPL-3.0-or-later; was Sie damit erarbeiten, gehört Ihnen —
      [Impressum](https://qdapy.zotqda.org/latest/de/impressum.html) ·
      [Datenschutz](https://qdapy.zotqda.org/latest/de/datenschutz.html)

# Das Aussehen kommt aus der vendorten zotqda-theme-Extension (Auffrischen
# mit ../update-theme.sh); toc und code-copy bringt das Format mit.
format:
  zotqda-theme-html:
    css: fonts/noto.css
    include-after-body: theme/scripts.html
